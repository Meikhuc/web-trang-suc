<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/gio hang1.css">
    <title>My Store</title>
</head>
<body>
    <div id="header"></div>
    <script src="../scripts/linkHeader.js"></script>
        
    <div class="container">
        <div class="cart" id="cart-container">
            <h2 id="cart-title">GIỎ HÀNG CỦA BẠN</h2>
            <!-- Cart items được thêm động -->
            <div class="gift-section" style="display: none">
                <p>Chọn quà tặng đi kèm sản phẩm (đã có 2 phần quà trong giỏ):</p>
                <div>
                <input type="checkbox" id="gift1">
                <label for="gift1">Thiệp cưới</label>
                </div>
                <div>
                <input type="checkbox" id="gift2">
                <label for="gift2">Thiệp tỏ tình</label>
                </div>
            </div>
        </div>

        <div class="box-container">
            <div class="summary">
                <div class="summary-section">
                    <h3>TÓM TẮT ĐƠN HÀNG</h3>
                    <p><span>Tổng tiền hàng:</span> <span id="total-raw">0₫</span></p>
                    <p><span>Tạm tính:</span> <span id="subtotal">0₫</span></p>
                    <p class="total"><span>Tổng tiền:</span> <span id="total">0₫</span></p>
                </div>
            </div>
            <div class="summary">
                <div class="summary-section">
                <button class="btn btn-primary">MUA HÀNG</button>
                <button class="btn btn-secondary">MUA THÊM SẢN PHẨM</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const cartItemsData = [];

        const storedCart = JSON.parse(localStorage.getItem('cartItems'));
        if (storedCart && storedCart.length > 0) {
        storedCart.forEach(itemData => {
            cartItemsData.push(itemData);
        });
        localStorage.removeItem('cartItems');
        }

        function formatVND(number) {
        return number.toLocaleString('vi-VN') + '₫';
        }

        function updateSummary() {
        let total = 0;

        const checkedItems = document.querySelectorAll('.cart-item input[type="checkbox"]:checked');
        checkedItems.forEach(item => {
            const qty = parseInt(item.closest('.cart-item').querySelector('.qty').value) || 0;
            const price = parseInt(item.closest('.cart-item').getAttribute('data-price'));
            total += qty * price;
        });

        document.getElementById('total-raw').textContent = formatVND(total);
        document.getElementById('subtotal').textContent = formatVND(total);
        document.getElementById('total').textContent = formatVND(total);

        const itemCount = checkedItems.length;
        document.getElementById('cart-title').textContent = `GIỎ HÀNG CỦA BẠN${itemCount > 0 ? ` (có ${itemCount} sản phẩm trong giỏ hàng)` : ''}`;

        // Hiển thị hoặc ẩn phần quà tặng dựa vào số lượng sản phẩm được chọn
        const giftSection = document.querySelector('.gift-section');
        giftSection.style.display = itemCount > 0 ? 'block' : 'none';
        }

        function createCartItem(data) {
        const item = document.createElement('div');
        item.className = 'cart-item';
        item.setAttribute('data-price', data.price);
        item.innerHTML = `
            <input type="checkbox" checked>
            <img src="${data.img}" alt="${data.name}">
            <div class="item-info">
            <strong>${data.name}</strong><br>
            ${data.color}<br>
            Ngày dự kiến nhận hàng: ${data.date}
            </div>
            <div class="quantity-control">
            <button class="minus">-</button>
            <input type="text" value="${data.quantity}" class="qty" style="width: 30px; text-align:center;">
            <button class="plus">+</button>
            </div>
            <div class="price">
            ${formatVND(data.price)}
            <button class="remove-btn">×</button>
            </div>
        `;

        item.querySelector('.plus').addEventListener('click', () => {
            const input = item.querySelector('.qty');
            input.value = parseInt(input.value) + 1;
            updateSummary();
        });

        item.querySelector('.minus').addEventListener('click', () => {
            const input = item.querySelector('.qty');
            input.value = Math.max(1, parseInt(input.value) - 1);
            updateSummary();
        });

        item.querySelector('.qty').addEventListener('input', updateSummary);

        item.querySelector('input[type="checkbox"]').addEventListener('change', updateSummary);

        item.querySelector('.remove-btn').addEventListener('click', () => {
            item.remove();
            updateSummary();
        });

        return item;
        }

        window.addEventListener('DOMContentLoaded', () => {
        const cartContainer = document.getElementById('cart-container');
        const giftSection = document.querySelector('.gift-section');

        cartItemsData.forEach(itemData => {
            const cartItem = createCartItem(itemData);
            cartContainer.insertBefore(cartItem, giftSection);
        });

        updateSummary();
        });
    </script>

    <div id="footer"></div>
    <script src="../scripts/linkFooter.js"></script>
</body>
</html>
