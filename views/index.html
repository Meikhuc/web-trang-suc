<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>My Store</title>
</head>
<body>
    <div id="header"></div>
    <script src="../scripts/linkHeader.js"></script>
  
    <div class="breadcrumb">
        <a href="#">Trang chủ</a> &gt; <a href="#">Danh mục</a> &gt; <span>Trang hiện tại</span>
    </div>
    
      <section>
        <div class="slider-container">
            <div class="slider" id="slider">
              <img src="https://huythanhjewelry.vn/storage/photos/shares/TKM-T3_2-09.jpg" alt="Ảnh 1">
              <img src="https://cdn.huythanhjewelry.vn/storage/photos/uploads/huyenlizziepcha-sz_1736748425.jpg" alt="Ảnh 2">
              <img src="https://cdn.huythanhjewelry.vn/storage/photos/uploads/huyenlizziepc-ha-sz_1736748436.jpg" alt="Ảnh 3">
            </div>
        </div>

        <div class="product-slider-wrapper">
          <button class="prev" id="prevPage">&#10094;</button>
        
          <div class="products-container" id="product-list"></div>
        
          <button class="next" id="nextPage">&#10095;</button>
        </div>        

        <div class="banner-bg">
          <div class="banner-content">
            <h2>NHẪN CƯỚI MỚI NHẤT</h2>
            <button>Xem ngay</button>
          </div>
        </div> 
                   
        <div class="section-title">Sản phẩm bán chạy nhất</div>
        <div class="best-sellers">
          <div class="policy-grid">
            <div>Chính sách thu đổi</div>
            <div>Chính sách bảo hành</div>
            <div>Chính sách vận chuyển</div>
            <div>Hướng dẫn đo size tay</div>
          </div>
        </div>
      </section>
    
      <script>
        // Lấy danh sách đã yêu thích từ localStorage
        function getFavorites() {
          return JSON.parse(localStorage.getItem('favorites')) || [];
        }
      
        function setFavorites(favorites) {
          localStorage.setItem('favorites', JSON.stringify(favorites));
        }
      
        // Cập nhật số yêu thích trên icon header
        function updateFavoriteCount() {
          const icon = document.getElementById('favorite-icon');
          const favorites = getFavorites();
          icon.setAttribute('data-count', favorites.length);
        }
      
        // Xử lý click vào từng trái tim sản phẩm
        function toggleProductFavorite(event) {
          const btn = event.currentTarget;
          const productId = btn.getAttribute('data-id');
          let favorites = getFavorites();
      
          if (favorites.includes(productId)) {
            favorites = favorites.filter(id => id !== productId);
            btn.textContent = '🤍';
          } else {
            favorites.push(productId);
            btn.textContent = '❤️';
          }
      
          setFavorites(favorites);
          updateFavoriteCount();
        }
      
        // Khi trang load: đánh dấu sản phẩm đã yêu thích
        window.addEventListener('DOMContentLoaded', () => {
          const favoriteButtons = document.querySelectorAll('.favorite-btn');
          const favorites = getFavorites();
      
          favoriteButtons.forEach(btn => {
            const id = btn.getAttribute('data-id');
            if (favorites.includes(id)) {
              btn.textContent = '❤️';
            } else {
              btn.textContent = '🤍';
            }
      
            btn.addEventListener('click', toggleProductFavorite);
          });
      
          updateFavoriteCount();
        });
      </script>
      
    <div id="footer"></div>
    <script src="../scripts/linkFooter.js"></script>

    <script src="../scripts/indexScripts.js"></script>

    <script src="../scripts/indexSp.js"></script>
</body>
</html>
