<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Trang Sản Phẩm</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #fff;
      color: #333;
    }

    header {
      display: flex;
      justify-content: space-between;
      padding: 20px;
      flex-wrap: wrap;
      align-items: center;
    }

    .filters span {
      margin-right: 10px;
      font-weight: bold;
    }

    .filters select,
    .sort select {
      margin-right: 10px;
      padding: 5px;
    }

    hr {
      border: none;
      border-top: 1px solid #ccc;
      margin: 0 20px;
    }

    .product-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 30px 20px;
      gap: 30px;
    }

    .product {
      max-width: 200px;
      text-align: center;
    }

    .product img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }

    .info {
      margin-top: 10px;
    }

    .brand {
      font-weight: bold;
      color: #004080;
      display: block;
      margin-bottom: 5px;
    }

    .price {
      color: #e26b6b;
      font-weight: bold;
      margin-top: 5px;
    }

    .badge {
      display: inline-block;
      background: #ffebeb;
      color: #d60000;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
      margin: 2px 2px 4px;
    }
  </style>
</head>
<body>
  <header>
    <div class="filters">
      <span>Bộ lọc :</span>
      <select><option>Khoảng giá</option></select>
      <select><option>Màu sắc</option></select>
      <select><option>Chất liệu</option></select>
      <select><option>Đá</option></select>
    </div>
    <div class="sort">
      <label for="sort">Sắp xếp:</label>
      <select id="sort">
        <option>Sản phẩm mới nhất</option>
        <option>Giá tăng dần</option>
        <option>Giá giảm dần</option>
      </select>
    </div>
  </header>

  <hr/>

  <section class="product-list">
    <div class="product">
      <img src="https://i.imgur.com/XMgeX3d.png" alt="Dây chuyền bướm" />
    </div>
    <div class="product">
      <img src="https://i.imgur.com/1ea6EtJ.png" alt="Vòng tay bướm" />
    </div>
    <div class="product">
      <img src="https://i.imgur.com/bnH2nYO.png" alt="Nhẫn cầu hôn 1" />
      <div class="info">
        <div class="badge">🎁 Quà tặng 0đ</div>
        <div class="badge">🚚 Freeship</div>
        <span class="brand">EVERMORE</span>
        <p>Nhẫn cầu hôn Vàng 18K Kim cương Lab-grown</p>
        <p class="price">30.695.000₫</p>
      </div>
    </div>
    <div class="product">
      <img src="https://i.imgur.com/TpKAzvY.png" alt="Nhẫn cưới" />
      <div class="info">
        <div class="badge">🎁 Quà tặng 0đ</div>
        <div class="badge">🚚 Freeship</div>
        <span class="brand">EVERMORE</span>
        <p>Nhẫn cưới Vàng 14K Kim cương Lab-grown</p>
        <p class="price">9.200.000₫</p>
      </div>
    </div>
    <div class="product">
      <img src="https://i.imgur.com/FxB3rEC.png" alt="Nhẫn cầu hôn 2" />
      <div class="info">
        <div class="badge">🎁 Quà tặng 0đ</div>
        <div class="badge">🚚 Freeship</div>
        <span class="brand">BEYOND</span>
        <p>Nhẫn cầu hôn Vàng 14K đá Moissanite</p>
        <p class="price">8.273.000₫</p>
      </div>
    </div>
  </section>
</body>
</html>
