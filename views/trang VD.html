<!-- index.html -->
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Trang sản phẩm</title>
  <style>
    .product { border: 1px solid #ddd; padding: 10px; margin: 10px; width: 200px; text-align: center; }
    .heart { cursor: pointer; font-size: 20px; color: #999; }
    .heart.active { color: red; }
  </style>
</head>
<body>

<h2>Danh sách sản phẩm</h2>
<div id="products">
  <!-- Sản phẩm mẫu -->
  <div class="product" data-id="1" data-name="Nhẫn BEYOND" data-price="8172000" data-img="https://cdn.pnj.io/images/thumbnails/300/300/detailed/183/sp-gnddddw000449-nhan-cuoi-vang-trang-14k-dinh-da-moissanite-pnj-1.png">
    <img src="https://cdn.pnj.io/images/thumbnails/300/300/detailed/183/sp-gnddddw000449-nhan-cuoi-vang-trang-14k-dinh-da-moissanite-pnj-1.png" width="150"><br>
    Nhẫn BEYOND<br>
    <span style="color: #e26678">8.172.000₫</span><br>
    <span class="heart" onclick="toggleFavorite(this)">♥</span>
  </div>

  <!-- Thêm nhiều sản phẩm khác tại đây -->
</div>

<script>
  function toggleFavorite(el) {
    const card = el.closest('.product');
    const id = card.dataset.id;

    let favorites = JSON.parse(localStorage.getItem('favorites')) || [];

    if (favorites.some(p => p.id === id)) {
      favorites = favorites.filter(p => p.id !== id);
      el.classList.remove('active');
    } else {
      favorites.push({
        id: id,
        name: card.dataset.name,
        price: card.dataset.price,
        img: card.dataset.img
      });
      el.classList.add('active');
    }

    localStorage.setItem('favorites', JSON.stringify(favorites));
  }

  // Tô đỏ những sản phẩm đã thích khi tải lại
  window.onload = function () {
    const favorites = JSON.parse(localStorage.getItem('favorites')) || [];
    document.querySelectorAll('.product').forEach(card => {
      const id = card.dataset.id;
      if (favorites.some(p => p.id === id)) {
        card.querySelector('.heart').classList.add('active');
      }
    });
  };
</script>
</body>
</html>
