<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Demo Hover Sản phẩm</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    
    .product-card {
      width: 250px;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      text-align: center;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
      transition: box-shadow 0.3s ease;
      position: relative;
    }

    .product-card:hover {
      box-shadow: 0px 8px 20px rgba(0,0,0,0.3);
    }

    .product-image {
      position: relative;
      overflow: hidden;
    }

    .product-image img {
      width: 100%;
      height: auto;
      transition: transform 0.4s ease;
    }

    .product-card:hover .product-image img {
      transform: scale(1.08);
    }

    .add-product-to-cart {
      width: 100%;
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 16px;
      background-color: white;
      color: blue;
      font-weight: 100;
      border: 1px solid blue;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .product-card:hover .add-product-to-cart {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .product-info {
      padding: 15px;
    }

    .product-brand {
      color: #0056b3;
      font-size: 14px;
      margin: 5px 0;
      text-transform: uppercase;
    }

    .product-name {
      font-size: 16px;
      color: #000;
      margin: 5px 0;
    }

    .product-price {
      color: #e53935;
      font-weight: bold;
      margin: 10px 0 0 0;
      font-size: 18px;
    }
  </style>
</head>
<body>

<div class="product-card">
  <div class="product-image">
    <img src="https://cdn.huythanhjewelry.vn/storage/rs1100/shares/01upload/1740984846/ptb400vv_1741070718.png.webp" alt="Bộ trang sức vàng 14K">
  </div>
  <div class="product-info">
    <h3 class="product-brand">CRYSTAL HAVEN</h3>
    <p class="product-name">Bộ trang sức vàng 14K đá quý Mã não</p>
    <p class="product-price">30.695.000₫</p>    
  </div>
  <button class="add-product-to-cart">Thêm vào giỏ hàng</button>
</div>

</body>
</html>
